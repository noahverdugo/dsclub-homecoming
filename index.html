<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Correlation game</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c2430;
      --muted: #5c6b7a;
      --line: #d5dde6;
      --bg: #f4f7fb;
      --card: #ffffff;
      --blue: #1d4e89;
      --blue-dark: #163e6e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: var(--bg);
    }
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }
    .prompt {
      margin: 0 0 18px;
      font-size: 1.35rem;
      line-height: 1.35;
    }
    .choices {
      display: grid;
      gap: 12px;
    }
    button.choice, button.again {
      font: inherit;
      font-size: 1.35rem;
      text-align: left;
      padding: 18px 20px;
      border-radius: 12px;
      border: 2px solid var(--blue);
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
    }
    button.choice:hover, button.again:hover {
      background: var(--blue);
      color: white;
    }
    .result {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
    }
    canvas {
      width: 100%;
      height: auto;
      background: white;
    }
    .corr {
      font-size: 1.8rem;
      margin: 14px 0 6px;
    }
    .prize {
      font-size: 1.6rem;
      margin: 0 0 16px;
      font-weight: bold;
    }
    .prize.big { color: #0d7a3f; }
    .prize.small { color: #8a5a00; }
    .prize.none { color: var(--muted); }
    .hidden { display: none; }
    .error { color: #9b1c1c; }
  </style>
</head>
<body>
  <main>
    <h1>Correlation game</h1>
    <p class="prompt" id="prompt">Loading the four variables…</p>
    <div class="choices" id="choices"></div>
    <section class="result hidden" id="result">
      <canvas id="plot" width="800" height="480"></canvas>
      <p class="corr" id="corr"></p>
      <p class="prize" id="prize"></p>
      <button class="again" id="again" type="button">Next player</button>
    </section>
  </main>
  <script>
    const MAX_CHOICES = 5;

    let table = null;
    let wheelVariable = null;

    const promptEl = document.getElementById("prompt");
    const choicesEl = document.getElementById("choices");
    const resultEl = document.getElementById("result");
    const corrEl = document.getElementById("corr");
    const prizeEl = document.getElementById("prize");

    function parseCsv(text) {
      const lines = text.trim().split(/\r?\n/).filter((line) => line.trim());
      const headers = lines[0].split(",").map((cell) => cell.trim());
      const variables = headers.slice(1);
      const years = [];
      const series = Object.fromEntries(variables.map((name) => [name, []]));

      for (const line of lines.slice(1)) {
        const cells = line.split(",").map((cell) => cell.trim());
        years.push(Number(cells[0]));
        variables.forEach((name, index) => {
          series[name].push(Number(cells[index + 1]));
        });
      }

      return { years, variables, series };
    }

    function pearson(xs, ys) {
      const n = xs.length;
      let sumX = 0;
      let sumY = 0;
      let sumXX = 0;
      let sumYY = 0;
      let sumXY = 0;

      for (let i = 0; i < n; i++) {
        sumX += xs[i];
        sumY += ys[i];
        sumXX += xs[i] * xs[i];
        sumYY += ys[i] * ys[i];
        sumXY += xs[i] * ys[i];
      }

      const numerator = n * sumXY - sumX * sumY;
      const denominator = Math.sqrt(
        (n * sumXX - sumX * sumX) * (n * sumYY - sumY * sumY)
      );
      return denominator === 0 ? 0 : numerator / denominator;
    }

    function shuffled(items) {
      const copy = items.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function clearChoices() {
      choicesEl.innerHTML = "";
    }

    function addChoice(label, onClick) {
      const button = document.createElement("button");
      button.className = "choice";
      button.type = "button";
      button.textContent = label;
      button.addEventListener("click", onClick);
      choicesEl.appendChild(button);
    }

    function showWheelStep() {
      wheelVariable = null;
      resultEl.classList.add("hidden");
      clearChoices();
      promptEl.textContent = "What did the wheel land on?";
      table.variables.forEach((name) => {
        addChoice(name, () => showGuessStep(name));
      });
    }

    function showGuessStep(name) {
      wheelVariable = name;
      resultEl.classList.add("hidden");
      clearChoices();
      const others = table.variables.filter((variable) => variable !== name);
      const shown = shuffled(others).slice(0, MAX_CHOICES);
      promptEl.textContent = `Which of these is most correlated with ${name}?`;
      shown.forEach((choice) => {
        addChoice(choice, () => showResult(choice, shown));
      });
    }

    function showResult(choice, shown) {
      const ranked = shown
        .map((name) => ({
          name,
          r: pearson(table.series[wheelVariable], table.series[name])
        }))
        .sort((a, b) => Math.abs(b.r) - Math.abs(a.r));

      const place = ranked.findIndex((item) => item.name === choice);
      const selected = ranked[place];

      clearChoices();
      promptEl.textContent = `${wheelVariable} and ${choice}`;
      resultEl.classList.remove("hidden");
      drawScatter(wheelVariable, choice);
      corrEl.textContent = `Correlation: ${selected.r.toFixed(2)}`;

      prizeEl.className = "prize";
      if (place === 0) {
        prizeEl.textContent = "Big prize. That was the strongest match.";
        prizeEl.classList.add("big");
      } else if (place === 1) {
        prizeEl.textContent = "Small prize. That was the second-strongest match.";
        prizeEl.classList.add("small");
      } else {
        prizeEl.textContent = "No prize this round.";
        prizeEl.classList.add("none");
      }
    }

    function drawScatter(xName, yName) {
      const canvas = document.getElementById("plot");
      const ctx = canvas.getContext("2d");
      const xs = table.series[xName];
      const ys = table.series[yName];
      const width = canvas.width;
      const height = canvas.height;
      const pad = { left: 72, right: 24, top: 24, bottom: 64 };

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);

      const xLow = Math.min(...xs);
      const xHigh = Math.max(...xs);
      const yLow = Math.min(...ys);
      const yHigh = Math.max(...ys);
      const xSpan = (xHigh - xLow || 1) * 1.16;
      const ySpan = (yHigh - yLow || 1) * 1.16;
      const xMin = xLow - (xSpan - (xHigh - xLow || 0)) / 2;
      const xMax = xMin + xSpan;
      const yMin = yLow - (ySpan - (yHigh - yLow || 0)) / 2;
      const yMax = yMin + ySpan;

      const xScale = (value) =>
        pad.left + ((value - xMin) / xSpan) * (width - pad.left - pad.right);
      const yScale = (value) =>
        height - pad.bottom - ((value - yMin) / ySpan) * (height - pad.top - pad.bottom);

      ctx.strokeStyle = "#1c2430";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(pad.left, pad.top);
      ctx.lineTo(pad.left, height - pad.bottom);
      ctx.lineTo(width - pad.right, height - pad.bottom);
      ctx.stroke();

      ctx.fillStyle = "#1d4e89";
      xs.forEach((x, index) => {
        ctx.beginPath();
        ctx.arc(xScale(x), yScale(ys[index]), 6, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = "#1c2430";
      ctx.font = "22px Georgia, serif";
      ctx.textAlign = "center";
      ctx.fillText(xName, (pad.left + width - pad.right) / 2, height - 18);
      ctx.save();
      ctx.translate(24, (pad.top + height - pad.bottom) / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText(yName, 0, 0);
      ctx.restore();
    }

    document.getElementById("again").addEventListener("click", showWheelStep);

    fetch("game_data.csv")
      .then((response) => {
        if (!response.ok) throw new Error("Could not load game_data.csv");
        return response.text();
      })
      .then((text) => {
        table = parseCsv(text);
        showWheelStep();
      })
      .catch(() => {
        promptEl.textContent = "Could not load game_data.csv. Start the page with the local server in the README, then open http://localhost:8000.";
        promptEl.classList.add("error");
      });
  </script>
</body>
</html>
